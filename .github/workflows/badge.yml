name: Generate Badge

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  update:
    name: Update stats card
    runs-on: ubuntu-latest

    steps:
      - uses: datarootsio/github-stats-card@v1
        with:
          username: Karthih2
          gh_token_stats: ${{ secrets.GH_PAT }}
          gh_token_commits: ${{ secrets.GITHUB_TOKEN }}
          badge_path: assets/badge.svg

          header: "🐈‍⬛ Hi, I'm Karthick"
          about: "Data Engineering • AI/ML • Backend Development"

          theme: dark

          commit_message: "Update GitHub stats badge"
